name: 'Alert on native publish failure'
description: >
  File a GitHub issue when chunkhound-native fails before chunkhound can be
  released. Shared by
  release.yml's publish-native job and release-rc.yml's publish-rc-native
  job. Native publication is intentionally first, so this alert means the
  main package was not released; retry guidance depends on the release channel.

inputs:
  version-or-tag:
    description: Version or tag to reference in the issue title/body.
    required: true

runs:
  using: composite
  steps:
    # Deliberately no `if:` here. Composite-action steps' failure()/
    # success()/always() see only this composite action's own internal
    # step chain, not the calling job's prior steps -- an `if: failure()`
    # here would never fire even though the caller's publish step failed.
    # The gate belongs on the `uses:` line in the calling workflow instead
    # (see release.yml/release-rc.yml), since that's what determines
    # whether this action even runs. Once invoked, this single step
    # should just run unconditionally.
    - name: Create failure alert issue
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ALERT_VERSION_OR_TAG: ${{ inputs.version-or-tag }}
        ALERT_REPO: ${{ github.repository }}
        ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        gh issue create \
          --repo "$ALERT_REPO" \
          --title "chunkhound-native publish failed for $ALERT_VERSION_OR_TAG" \
          --body "chunkhound-native failed to publish for $ALERT_VERSION_OR_TAG before chunkhound could be released to PyPI.

        Workflow run: $ALERT_RUN_URL

        Next steps:
        - For tagged releases, re-run the native publish job if the failure looks transient; already-uploaded files are skipped.
        - For automatic alpha releases, retry the failed native publish job only if no native files reached PyPI. After a partial native upload, use Re-run all jobs on the current main CI run to allocate a fresh version.
        - After native publication succeeds, tagged releases can retry the main publish job. For alphas, retry it only if no main files reached PyPI; after a partial main upload, use Re-run all jobs on the current main CI run to allocate a fresh version."
