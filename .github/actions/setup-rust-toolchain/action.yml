name: 'Set up Rust toolchain'
description: >
  Install the stable Rust toolchain and cache Cargo's registry/git checkouts
  and the build output directory, keyed on Cargo.lock. Shared by
  build-rust-extension, build-native-wheel, and ci.yml's rust-checks job,
  which previously each carried their own copy of these two steps.

runs:
  using: composite
  steps:
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        # env.pythonLocation is folded into the key because pyo3's build
        # script bakes the absolute path to the Python install (incl. patch
        # version, e.g. .../Python/3.14.7/x64) into cached target/ build
        # output on Windows, where linking the cdylib requires python3.lib.
        # Without this, a routine patch bump of the hosted runner's Python
        # (3.14.6 -> 3.14.7) leaves the old path baked into a restored
        # target/ that cargo doesn't know to invalidate, so the linker fails
        # with LNK1181: cannot open input file 'python3.lib'. Jobs that never
        # set up Python (e.g. rust-checks) get an empty segment here, which
        # is fine -- they don't link against libpython.
        key: ${{ runner.os }}-${{ runner.arch }}-py${{ env.pythonLocation }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-py${{ env.pythonLocation }}-cargo-
