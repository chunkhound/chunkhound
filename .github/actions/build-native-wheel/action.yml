name: 'Build native wheel'
description: >
  Build the chunkhound_native release wheel via `maturin build --release
  --auditwheel repair` and smoke-test that it actually imports. Shared by
  release.yml and release-rc.yml, which previously each carried their own
  byte-identical copy of this step, plus ci.yml's native-wheel-smoke-arm64,
  native-dev-macos, watchman-runtime-validation (Linux/Windows), and
  watchman-rollout-gate jobs (all with skip-tag-version-patch: true, since a
  CI branch/PR ref has no release tag to derive a version from). Published
  native-wheel support is
  macOS arm64, Linux x86_64/aarch64 (manylinux_2_31), and Windows x86_64.
  Intel macOS is deliberately excluded: free Intel macOS runners are retired,
  and arm64 cross-compilation has unresolved PyO3 framework-linking failures.
  Linux wheels are built inside a pinned Ubuntu 20.04 container (glibc 2.31)
  instead of on the runner's own glibc (>=2.34 on ubuntu-latest/ubuntu-24.04-arm),
  so the wheel installs on glibc 2.31+ hosts (including Ubuntu 20.04) rather
  than only 2.34+. scripts/finalize_manylinux_wheel.py then un-versions Rust
  std's weak statx/getrandom references, fails the build if any ELF file in
  the wheel needs a GLIBC_ symbol newer than 2.31, and rewrites RECORD for the
  patched extension (see that script for details). DuckDB's bundled prebuilt
  library needs glibc 2.25, below the 2.31 floor. musl needs a separate
  build; no native sdist fallback exists. Assumes the
  calling job has already checked out the repo and installed `uv`.

inputs:
  out-dir:
    description: Directory where the repaired native wheel is written.
    required: false
    default: dist
  skip-tag-version-patch:
    description: >
      Set to "true" for non-release callers (e.g. a CI smoke build) where
      GITHUB_REF_NAME isn't a release tag. Leaving this false (the default)
      preserves the original behavior for release.yml/release-rc.yml: a
      malformed/missing tag crashes the build loudly instead of silently
      publishing the Cargo.toml placeholder version.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Python 3.12  # abi3 wheel runs on Python 3.10+
      shell: bash
      run: uv python install 3.12

    - name: Resolve manylinux_2_31 build pins
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Ubuntu 20.04 is the oldest supported glibc host (2.31). Pin its
        # multi-arch manifest so a rerun uses the same baseline; bootstrap the
        # current Rust/maturin toolchain inside it below.
        {
          echo "MANYLINUX_IMAGE=ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214"
          echo "MANYLINUX_RUST_TOOLCHAIN=1.99.0"
          echo "MANYLINUX_MATURIN_VERSION=1.15.0"
          echo "MANYLINUX_UV_VERSION=0.13.1"
        } >> "$GITHUB_ENV"

    - name: Set up Rust toolchain
      if: runner.os != 'Linux'
      uses: ./.github/actions/setup-rust-toolchain

    # The Linux build runs in a container with its own toolchain, so the
    # host setup-rust-toolchain cache (host target/) is unused there. Cache
    # the container's rustup/cargo homes and target dir instead, outside the
    # workspace so a caller's own target/ cache never picks them up.
    - name: Cache manylinux_2_31 Rust build
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/manylinux-build
        key: manylinux_2_31-${{ runner.arch }}-${{ env.MANYLINUX_RUST_TOOLCHAIN }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: manylinux_2_31-${{ runner.arch }}-${{ env.MANYLINUX_RUST_TOOLCHAIN }}-cargo-

    - name: Patch Cargo.toml version from git tag
      shell: bash
      run: |
        # maturin build has no --set-version flag; it reads the wheel version from
        # Cargo.toml's [package] version. Cargo requires strict SemVer (a hyphen
        # before any pre-release suffix) while the git tag uses PEP 440 (no
        # hyphen, e.g. 5.2.0a3) -- convert before patching. maturin parses the
        # Cargo version via pep440_rs, which normalizes the hyphenated form to
        # the same PEP 440 version, so the wheel still ends up as 5.2.0a3.
        if [[ "${{ inputs.skip-tag-version-patch }}" != "true" ]]; then
          export TAG_VERSION="${GITHUB_REF_NAME#v}"
          uv run --no-project --python 3.12 python - <<'PYEOF'
        import os, re, pathlib

        tag_version = os.environ["TAG_VERSION"]
        m = re.match(r"^(\d+\.\d+\.\d+)([a-zA-Z].*)?$", tag_version)
        if not m:
            raise SystemExit(
                f"GITHUB_REF_NAME {tag_version!r} is not a PEP 440 release tag; "
                "refusing to build/publish an unversioned wheel. Pass "
                "skip-tag-version-patch: true for non-release callers."
            )
        cargo_version = f"{m.group(1)}-{m.group(2)}" if m.group(2) else m.group(1)
        path = pathlib.Path("Cargo.toml")
        text = path.read_text()
        new_text = re.sub(r'(?m)^version = ".*"', f'version = "{cargo_version}"', text, count=1)
        path.write_text(new_text)
        PYEOF
        fi

    - name: Build native wheel (Linux, manylinux_2_31 container)
      if: runner.os == 'Linux'
      shell: bash
      env:
        DUCKDB_DOWNLOAD_LIB: "1"
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        # No QEMU: ubuntu-24.04-arm is itself an aarch64 host, so Ubuntu
        # 20.04's multi-arch image runs natively there.
        BUILD_CACHE="$RUNNER_TEMP/manylinux-build"
        mkdir -p "$BUILD_CACHE/home" "$OUT_DIR"
        # Resolve relative inputs against the workspace, then mount the output
        # separately so callers may also provide an absolute out-dir.
        OUT_DIR="$(realpath "$OUT_DIR")"
        # maturin treats a sibling pyproject.toml as authoritative package metadata
        # ("mixed" Rust/Python project support), which misnames this wheel as
        # "chunkhound" (the main package) instead of "chunkhound_native". Hide the
        # Python package's pyproject.toml for the build; the trap restores it
        # even if the container build fails.
        mv pyproject.toml pyproject.toml.hidden
        trap 'mv pyproject.toml.hidden pyproject.toml' EXIT

        cat > "$RUNNER_TEMP/build-manylinux-2-31.sh" <<'CONTAINER_SCRIPT'
        set -euo pipefail
        # The base image deliberately supplies glibc 2.31 but no build tools.
        # Build as root inside the container, then restore host ownership of
        # its mounted output and cache so subsequent action steps and cache
        # save/restore can access them.
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq build-essential binutils ca-certificates curl patchelf
        export HOME=/build/home
        export RUSTUP_HOME=/build/rustup
        export CARGO_HOME=/build/cargo
        export CARGO_TARGET_DIR=/build/target
        export PATH="$CARGO_HOME/bin:/build/venv/bin:/build/uv:$PATH"
        bash -euo pipefail <<'BUILD_SCRIPT'
        if ! command -v uv >/dev/null; then
          mkdir -p /build/uv
          case "$(uname -m)" in
            x86_64|aarch64) uv_arch="$(uname -m)" ;;
            *) echo "Unsupported Linux arch for uv: $(uname -m)" >&2; exit 1 ;;
          esac
          # The statically linked musl uv build is used so the bootstrap
          # tool has no glibc requirement at all. The glibc-gnu build needs
          # glibc 2.28+ (statx), which this 2.31 container satisfies, but the
          # musl build keeps the bootstrap independent of the container's libc.
          curl -LsSf "https://github.com/astral-sh/uv/releases/download/$MANYLINUX_UV_VERSION/uv-${uv_arch}-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /build/uv
        fi
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
        fi
        rustup toolchain install "$MANYLINUX_RUST_TOOLCHAIN" --profile minimal
        rustup default "$MANYLINUX_RUST_TOOLCHAIN"
        [[ -x /build/venv/bin/python ]] || uv venv --python 3.12 /build/venv
        # auditwheel supplies the PEP 600 manylinux_2_31 repair policy;
        # patchelf is maturin's optional extra needed for repair.
        uv pip install --python /build/venv/bin/python -q \
          "maturin[patchelf]==$MANYLINUX_MATURIN_VERSION" "auditwheel==6.8.2"
        cd /work
        cargo clean -p chunkhound_native --release
        # Rust std emits weak statx/getrandom references with a symbol version
        # from the compiler's build host. Build an un-repaired wheel first so
        # the finalizer can remove that non-requirement before auditwheel
        # validates the requested manylinux_2_31 policy. Running auditwheel
        # through maturin first would reject statx@GLIBC_2.28 before the
        # finalizer gets a chance to patch it.
        mkdir -p /out/unrepaired
        maturin build --release --compatibility linux --auditwheel skip --out /out/unrepaired/
        shopt -s nullglob
        wheels=(/out/unrepaired/chunkhound_native-*.whl)
        if [[ ${#wheels[@]} -ne 1 ]]; then
          echo "Expected exactly one un-repaired chunkhound_native wheel" >&2
          exit 1
        fi
        python /work/scripts/finalize_manylinux_wheel.py "${wheels[0]}" --max-glibc 2.31
        duckdb_lib="$(find "$CARGO_TARGET_DIR" -type f -name libduckdb.so -print -quit)"
        if [[ -z "$duckdb_lib" ]]; then
          echo "Could not find the DuckDB shared library for auditwheel repair" >&2
          exit 1
        fi
        # Auditwheel's CLI requires the architecture-qualified PEP 600 policy
        # name (for example, manylinux_2_31_aarch64), unlike maturin's base
        # policy spelling. Repair both bundles DuckDB and validates every ELF.
        auditwheel repair --plat "manylinux_2_31_$(uname -m)" --wheel-dir /out \
          --ldpaths "$(dirname "$duckdb_lib")" "${wheels[0]}"
        BUILD_SCRIPT
        chown -R "$HOST_UID:$HOST_GID" /build /out
        CONTAINER_SCRIPT

        docker run --rm \
          -v "$(pwd)":/work \
          -v "$OUT_DIR":/out \
          -v "$BUILD_CACHE":/build \
          -v "$RUNNER_TEMP/build-manylinux-2-31.sh":/tmp/build-manylinux-2-31.sh:ro \
          -e DUCKDB_DOWNLOAD_LIB \
          -e HOST_UID="$(id -u)" \
          -e HOST_GID="$(id -g)" \
          -e MANYLINUX_RUST_TOOLCHAIN \
          -e MANYLINUX_MATURIN_VERSION \
          -e MANYLINUX_UV_VERSION \
          -e RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN' \
          "$MANYLINUX_IMAGE" \
          bash /tmp/build-manylinux-2-31.sh

    - name: Build native wheel (macOS/Windows)
      if: runner.os != 'Linux'
      shell: bash
      env:
        DUCKDB_DOWNLOAD_LIB: "1"
      run: |
        # maturin treats a sibling pyproject.toml as authoritative package metadata
        # ("mixed" Rust/Python project support), which misnames this wheel as
        # "chunkhound" (the main package) instead of "chunkhound_native". Hide the
        # Python package's pyproject.toml for the build; nothing else in this job
        # needs it (the uv commands above already use --no-project).
        mv pyproject.toml pyproject.toml.hidden
        # maturin's repair step hard-links its staging copy
        # (target/maturin/lib*.so) to the real cargo output
        # (target/release/deps/lib*.so) and has patchelf rewrite that
        # in-place file's RPATH/NEEDED entries for the wheel -- which,
        # because of the hard link, permanently mutates the cached cargo
        # artifact itself. Cargo's fingerprint then considers the crate
        # unchanged and won't relink it, so a second build against the
        # same warm `target/` cache fails with "Cannot repair wheel,
        # because required library lib*-<hash>.so could not be located"
        # -- reproduced directly. This specifically bites a manual re-run
        # of this job for the *same* tag (Cargo.toml's version patch above
        # means a genuinely new tag usually gets a fresh fingerprint, but
        # a rerun of a failed/retried job for one tag does not).
        # Force a fresh link of just this crate every time; the expensive
        # dependency compilation (duckdb, arrow, ...) stays cached.
        cargo clean -p chunkhound_native --release
        mkdir -p "${{ inputs.out-dir }}"
        # --auditwheel repair makes maturin bundle DuckDB's shared library
        # into the wheel and rewrite the extension's link path to resolve
        # it relative to itself (its own native re-implementations of
        # delocate/delvewheel on macOS/Windows -- see maturin >=1.13).
        # Without this flag maturin only *warns* about the external
        # dependency instead of fixing it.
        uvx --python 3.12 maturin build --release --auditwheel repair --out "${{ inputs.out-dir }}/"
        mv pyproject.toml.hidden pyproject.toml

    - name: Smoke test native wheel API
      shell: bash
      run: |
        # Run outside the repo root: the repo's own chunkhound_native/__init__.py
        # source-tree stub (populated by scripts/install_native.py for the local
        # maturin build + install_native.py dev workflow) would otherwise shadow
        # the installed wheel package,
        # since it expects a compiled extension sitting next to it that only
        # exists after a local editable build, not in this CI job. Catches a
        # wheel that built successfully but doesn't actually import (e.g. a
        # macOS/Windows repair edge case) before it reaches PyPI -- alpha/beta/rc
        # tags publish with no other gate on the native wheel's importability.
        WORKSPACE_DIR="$(pwd)"
        WHEEL_DIR="$WORKSPACE_DIR/${{ inputs.out-dir }}"
        TMP_DIR="$(mktemp -d)"
        cd "$TMP_DIR"
        uv run --no-project --python 3.12 --with "$WHEEL_DIR"/chunkhound_native-*.whl \
          python "$WORKSPACE_DIR/scripts/smoke_test_native_wheel.py"
