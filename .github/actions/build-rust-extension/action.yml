name: 'Build Rust extension'
description: >
  Install Rust toolchain, cache build artifacts, and build chunkhound_native
  via maturin develop.  Also removes the PyPI-installed chunkhound-native so
  the locally-built extension (placed in chunkhound_native/ by maturin) is
  importable without being shadowed by the published package in site-packages.

runs:
  using: composite
  steps:
    - name: Install Rust stable toolchain
      if: hashFiles('Cargo.toml') != ''
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build artifacts
      if: hashFiles('Cargo.toml') != ''
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Cache DuckDB precompiled library
      if: hashFiles('Cargo.toml') != ''
      uses: actions/cache@v4
      with:
        path: target/duckdb-download/
        key: ${{ runner.os }}-duckdb-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-duckdb-

    - name: Build Rust extension (maturin develop)
      if: hashFiles('Cargo.toml') != ''
      shell: bash
      env:
        DUCKDB_DOWNLOAD_LIB: "1"
      run: |
        uv pip install maturin
        uv run maturin develop
        # maturin develop re-installs the stale PyPI chunkhound-native as a
        # transitive dep.  uv run (used in subsequent steps) enforces declared
        # deps and would reinstall it if we uninstalled it.  Instead, overwrite
        # only the .so/.pyd and __init__.py inside site-packages so the
        # dist-info stays intact (uv sees it as satisfied) but the locally-built
        # symbols (e.g. IndexingPipeline) are present.
        SITE_CN="$(find .venv -path '*/site-packages/chunkhound_native' -type d | head -1)"
        BUILT_SO="$(find chunkhound_native -maxdepth 1 \( -name '*.so' -o -name '*.pyd' \) -print | head -1)"
        if [[ -n "$BUILT_SO" && -n "$SITE_CN" ]]; then
          cp "$BUILT_SO" "$SITE_CN/"
          cp chunkhound_native/__init__.py "$SITE_CN/__init__.py"
          echo "Patched $SITE_CN with locally-built extension ($BUILT_SO)"
        else
          echo "WARNING: Could not patch site-packages chunkhound_native (BUILT_SO=$BUILT_SO, SITE_CN=$SITE_CN)"
        fi
        # On macOS and Windows, the DuckDB shared library is not findable
        # at runtime by default.  Copy it next to the native extension so
        # the dynamic linker can resolve it.  It must land next to BOTH
        # copies of the extension: the source-tree chunkhound_native/ (used
        # when the package resolves via the editable install) and the
        # site-packages copy patched in above (what actually gets imported
        # once the PyPI dist-info is kept intact — see patch step above).
        # macOS survives on DYLD_LIBRARY_PATH regardless of directory, but
        # Windows' loader has not honored PATH for extension-module
        # dependencies since Python 3.8, so duckdb.dll MUST be co-located
        # with whichever chunkhound_native.pyd Python actually loads.
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          DUCKDB_LIB=$(find target -name 'libduckdb.dylib' -print -quit 2>/dev/null || true)
          if [[ -n "$DUCKDB_LIB" ]]; then
            cp "$DUCKDB_LIB" chunkhound_native/
            echo "Copied $DUCKDB_LIB → chunkhound_native/"
            if [[ -n "$SITE_CN" ]]; then
              cp "$DUCKDB_LIB" "$SITE_CN/"
              echo "Copied $DUCKDB_LIB → $SITE_CN/"
            fi
          else
            echo "WARNING: libduckdb.dylib not found in target/ — macOS contract tests will fail"
          fi
        elif [[ "$RUNNER_OS" == "Windows" ]]; then
          DUCKDB_DLL=$(find target -name 'duckdb.dll' -print -quit 2>/dev/null || true)
          if [[ -n "$DUCKDB_DLL" ]]; then
            cp "$DUCKDB_DLL" chunkhound_native/
            echo "Copied $DUCKDB_DLL → chunkhound_native/"
            if [[ -n "$SITE_CN" ]]; then
              cp "$DUCKDB_DLL" "$SITE_CN/"
              echo "Copied $DUCKDB_DLL → $SITE_CN/"
            fi
          else
            echo "WARNING: duckdb.dll not found in target/ — Windows contract tests will fail"
          fi
        fi
