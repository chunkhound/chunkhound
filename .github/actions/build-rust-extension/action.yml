name: 'Build Rust extension'
description: >
  Install Rust toolchain, cache build artifacts, and build chunkhound_native
  via maturin develop.  Also removes the PyPI-installed chunkhound-native so
  the locally-built extension (placed in chunkhound_native/ by maturin) is
  importable without being shadowed by the published package in site-packages.

runs:
  using: composite
  steps:
    - name: Set up Rust toolchain
      if: hashFiles('Cargo.toml') != ''
      uses: ./.github/actions/setup-rust-toolchain

    - name: Cache DuckDB precompiled library
      if: hashFiles('Cargo.toml') != ''
      uses: actions/cache@v4
      with:
        path: target/duckdb-download/
        key: ${{ runner.os }}-duckdb-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-duckdb-

    - name: Build Rust extension (maturin develop)
      if: hashFiles('Cargo.toml') != ''
      shell: bash
      env:
        DUCKDB_DOWNLOAD_LIB: "1"
      run: |
        # Bake a self-relative RPATH into the extension at link time, so it
        # resolves its DuckDB dependency next to wherever it ends up (dev
        # tree or installed wheel) instead of an absolute build-machine path
        # or an external environment variable. Windows has no RPATH concept;
        # it's handled at import time instead by the os.add_dll_directory()
        # guard in chunkhound_native/__init__.py.
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          export RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN'
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          export RUSTFLAGS='-C link-arg=-Wl,-rpath,@loader_path'
        fi
        uv pip install maturin
        uv run maturin develop
        # maturin develop re-installs the stale PyPI chunkhound-native as a
        # transitive dep.  uv run (used in subsequent steps) enforces declared
        # deps and would reinstall it if we uninstalled it.  Instead, overwrite
        # only the .so/.pyd and __init__.py inside site-packages so the
        # dist-info stays intact (uv sees it as satisfied) but the locally-built
        # symbols (e.g. IndexingPipeline) are present.
        SITE_CN="$(find .venv -path '*/site-packages/chunkhound_native' -type d | head -1)"
        BUILT_SO="$(find chunkhound_native -maxdepth 1 \( -name '*.so' -o -name '*.pyd' \) -print | head -1)"
        if [[ -n "$BUILT_SO" && -n "$SITE_CN" ]]; then
          # rm before cp (not just `cp -f`/`--remove-destination`, for
          # portability to platforms/cp variants without that flag): uv
          # installs packages by hardlinking from its shared cache
          # ($UV_CACHE_DIR) whenever cache and target share a filesystem, so
          # overwriting the existing file's content in place would mutate
          # that shared inode -- silently poisoning uv's cache with this
          # dev-only build for every other venv/job sharing the cache
          # (e.g. the fresh venvs scripts/verify_watchman_live_indexing_e2e.py
          # creates later in this same job to test a clean installed wheel).
          rm -f "$SITE_CN/$(basename "$BUILT_SO")" "$SITE_CN/__init__.py"
          cp "$BUILT_SO" "$SITE_CN/"
          cp chunkhound_native/__init__.py "$SITE_CN/__init__.py"
          echo "Patched $SITE_CN with locally-built extension ($BUILT_SO)"
        else
          echo "WARNING: Could not patch site-packages chunkhound_native (BUILT_SO=$BUILT_SO, SITE_CN=$SITE_CN)"
        fi
        # Copy the downloaded DuckDB runtime library next to the compiled
        # extension -- source tree and the site-packages copy patched in
        # above -- on every platform, so the self-relative RPATH/DLL-search
        # set up above has something to find. Same script used for local dev.
        uv run python scripts/copy_duckdb_runtime.py
