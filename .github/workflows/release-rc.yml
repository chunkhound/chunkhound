name: RC Release

# A maintainer tag push is the prerelease gate (protected by tag rules).
# After native publication, update uv.lock in a follow-up commit.
on:
  push:
    tags:
      - 'v*rc*'
      - 'v*b*'
      - 'v*a*'

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.tag.outputs.source_sha }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Validate pre-release tag format (PEP 440)
        id: tag
        shell: bash
        env:
          TAG_TO_VALIDATE: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PYCODE'
          import os, re, subprocess
          tag = os.environ["TAG_TO_VALIDATE"]
          match = re.fullmatch(r'v\d+\.\d+\.\d+(a|b|rc)\d+', tag)
          if not match:
              raise SystemExit(f"::error::Tag {tag!r} is not a valid PEP 440 pre-release (expected vX.Y.Z(a|b|rc)N)")
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"source_sha={source}\n")
          PYCODE

  release:
    needs: validate-tag
    permissions:
      contents: read
      id-token: write
      issues: write
    uses: ./.github/workflows/release-packages.yml
    with:
      release_tag: ${{ github.ref_name }}
      source_sha: ${{ needs.validate-tag.outputs.source_sha }}
