name: Release

# Publishing a GitHub Release remains the maintainer gate. The tag, not
# target_commitish (which may be a moving branch), identifies the source.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      id-token: write
      issues: write
    uses: ./.github/workflows/release-packages.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}
      source_sha: ${{ github.sha }}
