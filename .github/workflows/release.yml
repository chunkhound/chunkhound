name: Release

on:
  release:
    types: [published]

permissions:
  contents: read  # default for build jobs; publish/publish-native elevate below

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs requires full history for version derivation

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build source distribution
        run: uv build --sdist --out-dir dist

      - name: Upload source distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-runtime-wheels:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs requires full history for version derivation

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build packaged Watchman runtime wheel
        env:
          CHUNKHOUND_BUILD_PACKAGED_WATCHMAN_RUNTIME: "1"
        run: uv build --wheel --clear

      - name: Upload runtime wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  build-native-wheel:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # No Intel macOS (x86_64-apple-darwin) leg -- see AGENTS.md's
        # RUST_COMMANDS section for why that's a deliberate, documented gap
        # rather than an oversight.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build native wheel
        uses: ./.github/actions/build-native-wheel

      - name: Upload native wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-native-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: [build-sdist, build-runtime-wheels, build-native-wheel]
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 15
    permissions:
      contents: write  # gh release delete --cleanup-tag on failure
      id-token: write  # OIDC Trusted Publishing

    steps:
      - name: Download main distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-dist-{sdist,ubuntu-latest,windows-latest}
          path: dist
          merge-multiple: true

      - name: Publish chunkhound to PyPI
        id: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Cleanup on failure (delete release and tag)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.event.release.tag_name }}" \
            --cleanup-tag \
            --yes \
            --repo "${{ github.repository }}"

  publish-native:
    needs: [publish]
    runs-on: ubuntu-latest
    # Separate environment so this job carries an OIDC token scoped to the
    # chunkhound-native PyPI project (each project needs its own trusted-publisher
    # entry referencing this environment name). Depends on publish so the main
    # package is confirmed live before attempting the native publish — avoids
    # deleting a successfully-published release if only the native wheel fails.
    environment: pypi-native
    timeout-minutes: 15
    permissions:
      id-token: write  # OIDC Trusted Publishing (chunkhound-native PyPI project)
      issues: write    # gh issue create alert if publish-native fails

    steps:
      - name: Download native wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-dist-native-*
          path: dist-native
          merge-multiple: true

      - name: Publish chunkhound-native to PyPI
        id: publish-native
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-native

      - name: Alert on native publish failure
        # chunkhound is already live on PyPI at this point (publish-native
        # runs after publish, deliberately, so we never delete a good
        # chunkhound release just because the native wheel failed -- see
        # the `needs: [publish]` comment above). But that leaves a real
        # window where chunkhound is live with no matching chunkhound-native
        # release, and there's no PyPI API to yank a release automatically
        # (yanking is a manual, web-UI-only action) -- so the best CI can do
        # is make sure a human finds out immediately instead of via a user's
        # broken-install report. Needs the job-level `issues: write`
        # permission declared above.
        if: failure()
        uses: ./.github/actions/alert-native-publish-failure
        with:
          tag: ${{ github.event.release.tag_name }}
