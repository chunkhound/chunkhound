name: Release packages

# All callers pass an immutable tag and the tested commit explicitly.
# The validated tag alone selects the publication channel.
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      alpha: ${{ steps.release.outputs.alpha }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Validate requested tag and source
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          uv run --no-project python - <<'PYCODE'
          import os, re, subprocess
          tag = os.environ["RELEASE_TAG"]
          source = os.environ["SOURCE_SHA"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+(?:(a|b|rc)\d+)?)", tag)
          if not match:
              raise SystemExit(f"Invalid release tag: {tag!r}")
          alpha = match.group(2) == "a"
          if not re.fullmatch(r"[0-9a-f]{40}", source):
              raise SystemExit("source_sha must be a full commit SHA")
          resolved = subprocess.check_output(
              ["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"], text=True
          ).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if resolved != source or head != source:
              raise SystemExit(f"Release tag {tag} does not resolve to requested source {source}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={match.group(1)}\nsource_sha={source}\n")
              output.write(f"alpha={str(alpha).lower()}\n")
          PYCODE

  build-sdist:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0  # hatch-vcs requires full history for version derivation

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build source distribution
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
          CHUNKHOUND_BUILD_ALPHA_RELEASE: ${{ needs.prepare.outputs.alpha == 'true' && '1' || '' }}
        run: uv build --sdist --out-dir dist

      - name: Upload source distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true

  build-runtime-wheels:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0  # hatch-vcs requires full history for version derivation

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build packaged Watchman runtime wheel
        env:
          CHUNKHOUND_BUILD_PACKAGED_WATCHMAN_RUNTIME: "1"
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
          CHUNKHOUND_BUILD_ALPHA_RELEASE: ${{ needs.prepare.outputs.alpha == 'true' && '1' || '' }}
        run: uv build --wheel --clear

      - name: Upload runtime wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          overwrite: true

  build-native-wheel:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build native wheel
        uses: ./.github/actions/build-native-wheel
        with:
          release-tag: ${{ inputs.release_tag }}

      - name: Upload native wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-native-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          overwrite: true

  validate-release:
    needs: [build-sdist, build-runtime-wheels, build-native-wheel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # macOS/arm64 excluded: runner cost. Coverage exists via native-dev-macos
      # in ci.yml (source-level make dev) and build-native-wheel (wheel build).
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Download matching main wheel for validation
        uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ matrix.os }}
          path: main-dist

      - name: Download matching native wheel for validation
        uses: actions/download-artifact@v4
        with:
          name: release-dist-native-${{ matrix.os }}
          path: native-dist

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Validate combined wheel installation
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          main_wheels=(main-dist/*.whl)
          native_wheels=(native-dist/*.whl)
          if [[ ${#main_wheels[@]} -ne 1 ]]; then
            echo "Expected exactly one matching main wheel, found ${#main_wheels[@]}"
            exit 1
          fi
          if [[ ${#native_wheels[@]} -ne 1 ]]; then
            echo "Expected exactly one matching native wheel, found ${#native_wheels[@]}"
            exit 1
          fi

          uv python install 3.12
          workspace_dir="$(pwd)"
          validation_dir="$(mktemp -d)"
          cd "$validation_dir"
          uv run --no-project --python 3.12 \
            --with "$workspace_dir/main-dist"/*.whl \
            --with "$workspace_dir/native-dist"/*.whl \
            python "$workspace_dir/scripts/smoke_test_native_wheel.py"

  validate-artifacts:
    needs: [prepare, build-sdist, build-runtime-wheels, build-native-wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-dist-*
          path: artifacts
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Validate all versions and rebuild final sdist
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ALPHA_RELEASE: ${{ needs.prepare.outputs.alpha }}
        run: >-
          uv run --no-project --python 3.12 --with packaging
          python scripts/validate_release_artifacts.py
          --dist artifacts --rebuild-sdist

  publish:
    needs: [prepare, publish-native, build-sdist, build-runtime-wheels, validate-artifacts]
    runs-on: ubuntu-latest
    # PyPI trust must name release-packages.yml (the OIDC job_workflow_ref),
    # with the matching environment. Alpha has no approval gate; stable does.
    environment: ${{ needs.prepare.outputs.alpha == 'true' && 'pypi-alpha' || 'pypi' }}
    timeout-minutes: 15
    permissions:
      id-token: write  # OIDC Trusted Publishing

    steps:
      - name: Download main distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-dist-{sdist,ubuntu-latest,windows-latest}
          path: dist
          merge-multiple: true

      - name: Publish chunkhound to PyPI
        id: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish-native:
    needs: [prepare, build-native-wheel, validate-release, validate-artifacts]
    runs-on: ubuntu-latest
    # Separate environment so this job carries an OIDC token scoped to the
    # chunkhound-native PyPI project (each project needs its own trusted-publisher
    # entry referencing this environment name). Native publication is deliberately
    # first so the main package cannot become installable before its required
    # native wheels are available.
    environment: ${{ needs.prepare.outputs.alpha == 'true' && 'pypi-alpha-native' || 'pypi-native' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # OIDC Trusted Publishing (chunkhound-native PyPI project)
      issues: write    # gh issue create alert if publish-native fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Download native wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-dist-native-*
          path: dist-native
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Validate native wheel versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: uv run --no-project python scripts/validate_native_wheel_versions.py

      - name: Publish chunkhound-native to PyPI
        id: publish-native
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-native
          skip-existing: true

      - name: Alert on native publish failure
        # Native publication runs before publish, so a failure prevents the
        # main package from being released. The alert still makes failures in
        # publication or the pre-publish version gate visible to maintainers.
        if: failure()
        uses: ./.github/actions/alert-native-publish-failure
        with:
          tag: ${{ inputs.release_tag }}

  alert-native-prepublish-failure:
    needs: [build-native-wheel, validate-release, validate-artifacts]
    if: ${{ always() && (needs['build-native-wheel'].result == 'failure' || needs['validate-release'].result == 'failure' || needs['validate-artifacts'].result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Alert on native build or validation failure
        uses: ./.github/actions/alert-native-publish-failure
        with:
          tag: ${{ inputs.release_tag }}
