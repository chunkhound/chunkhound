name: Release packages

# Exactly one of release_tag (stable, beta, or RC; tagged alphas rejected) or
# automatic_alpha (tagless PyPI-allocated version) is required. source_sha is
# always the tested commit. Automatic alpha allocation, builds, validation, and
# publication share one global concurrency lock.
on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: ''
      automatic_alpha:
        required: false
        type: boolean
        default: false
      source_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.automatic_alpha && 'chunkhound-automatic-alpha' || format('chunkhound-release-{0}', inputs.release_tag) }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      alpha: ${{ steps.release.outputs.alpha }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Select and validate release
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          AUTOMATIC_ALPHA: ${{ inputs.automatic_alpha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ( -n "$RELEASE_TAG" && "$AUTOMATIC_ALPHA" == true ) || ( -z "$RELEASE_TAG" && "$AUTOMATIC_ALPHA" != true ) ]]; then
            echo "Exactly one of release_tag or automatic_alpha is required" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            # Tagged alphas are prohibited: automatic alphas are the only alpha
            # publication path, which avoids allocation races with manual tags.
            alpha_tag='^v[0-9]+\.[0-9]+\.[0-9]+a[0-9]+$'
            if [[ "$RELEASE_TAG" =~ $alpha_tag ]]; then
              echo "Tagged alpha publication is prohibited: $RELEASE_TAG" >&2
              exit 1
            fi
            uv run --no-project python scripts/release_tag.py validate \
              --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA"
            {
              echo "release_tag=$RELEASE_TAG"
              echo "release_version="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Retain an in-lock current-main check for visibility, but do not
          # skip: the pre-queue caller check is the supersession gate, and an
          # admitted tested snapshot always publishes even if main moves.
          # Informational only: a transient network failure must not abort the release.
          main_sha="$(git ls-remote "https://github.com/$REPOSITORY.git" refs/heads/main | awk '{print $1}' || true)"
          if [[ "$main_sha" != "$SOURCE_SHA" ]]; then
            echo "Main advanced after this tested snapshot entered the release lock; publishing $SOURCE_SHA (main is $main_sha)." >> "$GITHUB_STEP_SUMMARY"
          fi
          allocated="$(env -u GITHUB_OUTPUT uv run --no-project --with packaging python scripts/next_alpha_version.py)"
          version="${allocated#version=}"
          uv run --no-project python scripts/release_tag.py validate \
            --version "$version" --source-sha "$SOURCE_SHA"
          {
            echo "release_tag="
            echo "release_version=$version"
          } >> "$GITHUB_OUTPUT"

  build-sdist:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0  # hatch-vcs requires full history for version derivation

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build source distribution
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
          CHUNKHOUND_BUILD_ALPHA_RELEASE: ${{ needs.prepare.outputs.alpha == 'true' && '1' || '' }}
        run: uv build --sdist --out-dir dist

      - name: Upload source distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true

  build-runtime-wheels:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0  # hatch-vcs requires full history for version derivation

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build packaged Watchman runtime wheel
        env:
          CHUNKHOUND_BUILD_PACKAGED_WATCHMAN_RUNTIME: "1"
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
          CHUNKHOUND_BUILD_ALPHA_RELEASE: ${{ needs.prepare.outputs.alpha == 'true' && '1' || '' }}
        run: uv build --wheel --clear

      - name: Upload runtime wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          overwrite: true

  build-native-wheel:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build native wheel
        uses: ./.github/actions/build-native-wheel
        with:
          release-tag: ${{ needs.prepare.outputs.release_tag }}
          release-version: ${{ needs.prepare.outputs.release_version }}

      - name: Upload native wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-native-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          overwrite: true

  validate-release:
    needs: [build-sdist, build-runtime-wheels, build-native-wheel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # macOS/arm64 excluded: runner cost. Coverage exists via native-dev-macos
      # in ci.yml (source-level make dev) and build-native-wheel (wheel build).
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Download matching main wheel for validation
        uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ matrix.os }}
          path: main-dist

      - name: Download matching native wheel for validation
        uses: actions/download-artifact@v4
        with:
          name: release-dist-native-${{ matrix.os }}
          path: native-dist

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Validate combined wheel installation
        run: >-
          uv run --no-project python scripts/validate_release_wheels.py
          --main-dist main-dist --native-dist native-dist

  validate-artifacts:
    needs: [prepare, build-sdist, build-runtime-wheels, build-native-wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-dist-*
          path: artifacts
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Validate all versions and rebuild final sdist
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          ALPHA_RELEASE: ${{ needs.prepare.outputs.alpha }}
        run: >-
          uv run --no-project --python 3.12 --with packaging
          python scripts/validate_release_artifacts.py
          --dist artifacts --rebuild-sdist

  publish:
    needs: [prepare, publish-native, build-sdist, build-runtime-wheels, validate-artifacts]
    runs-on: ubuntu-latest
    # PyPI trust must name release-packages.yml (the OIDC job_workflow_ref),
    # with the matching environment. Alpha has no approval gate; stable does.
    environment: ${{ needs.prepare.outputs.alpha == 'true' && 'pypi-alpha' || 'pypi' }}
    timeout-minutes: 15
    permissions:
      id-token: write  # OIDC Trusted Publishing

    steps:
      - name: Download main distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-dist-{sdist,ubuntu-latest,windows-latest}
          path: dist
          merge-multiple: true

      - name: Publish chunkhound to PyPI
        id: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Tagged releases keep skip-existing; tagless automatic alphas never
          # reuse a version, so an existing file must fail the publish.
          skip-existing: ${{ needs.prepare.outputs.release_tag != '' }}
          # Attestations name the caller workflow, but PyPI trusts this reusable
          # workflow. Disable them until PyPI supports that identity mismatch.
          attestations: false

  publish-native:
    # Once a tested snapshot enters this serialized workflow, publish it even if
    # main moves while its artifacts are building. A later tested snapshot waits
    # for the lock and receives the next alpha serial.
    needs: [prepare, build-native-wheel, validate-release, validate-artifacts]
    runs-on: ubuntu-latest
    # Separate environment so this job carries an OIDC token scoped to the
    # chunkhound-native PyPI project (each project needs its own trusted-publisher
    # entry referencing this environment name). Native publication is deliberately
    # first so the main package cannot become installable before its required
    # native wheels are available.
    environment: ${{ needs.prepare.outputs.alpha == 'true' && 'pypi-alpha-native' || 'pypi-native' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # OIDC Trusted Publishing (chunkhound-native PyPI project)
      issues: write    # gh issue create alert if publish-native fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Download native wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-dist-native-*
          path: dist-native
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Validate native wheel versions
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: uv run --no-project python scripts/validate_native_wheel_versions.py

      - name: Publish chunkhound-native to PyPI
        id: publish-native
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-native
          skip-existing: ${{ needs.prepare.outputs.release_tag != '' }}
          # Same caller/reusable-workflow attestation mismatch as the main package.
          attestations: false

      - name: Alert on native publish failure
        # Native publication runs before publish, so a failure prevents the
        # main package from being released. The alert still makes failures in
        # publication or the pre-publish version gate visible to maintainers.
        if: failure()
        uses: ./.github/actions/alert-native-publish-failure
        with:
          version-or-tag: ${{ needs.prepare.outputs.release_tag || needs.prepare.outputs.release_version }}

  alert-native-prepublish-failure:
    needs: [prepare, build-native-wheel, validate-release, validate-artifacts]
    if: ${{ always() && (needs['build-native-wheel'].result == 'failure' || needs['validate-release'].result == 'failure' || needs['validate-artifacts'].result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Alert on native build or validation failure
        uses: ./.github/actions/alert-native-publish-failure
        with:
          version-or-tag: ${{ needs.prepare.outputs.release_tag || needs.prepare.outputs.release_version }}
