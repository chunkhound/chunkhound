[package]
name = "chunkhound_native"
version = "0.1.0"
edition = "2021"
# repeat_n (used in duckdb_backend.rs) was stabilized in 1.82
rust-version = "1.82"

[lib]
name = "chunkhound_native"
crate-type = ["cdylib"]

[dependencies]
pyo3       = { version = "0.22", features = ["extension-module", "abi3-py310"] }
rayon      = "1"
ignore     = "0.4"
# duckdb build mode is controlled by env vars, not Cargo features (duckdb default = []).
# DUCKDB_DOWNLOAD_LIB=1 downloads the precompiled shared lib from GitHub; it's
# linked dynamically and resolved via a self-relative RPATH/DLL search set up
# by RUSTFLAGS and scripts/copy_duckdb_runtime.py. See RUST_COMMANDS in
# AGENTS.md for the full per-platform recipe.
duckdb     = { version = "1" }
log        = "0.4"
pyo3-log   = "0.11"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
tempfile = "3"

[features]
default = ["rust-pipeline"]
rust-pipeline = []
